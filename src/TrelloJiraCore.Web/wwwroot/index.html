<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrelloJiraCore - مدیریت پروژه پیشرفته</title>
    <link rel="stylesheet" href="lib/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
    <header class="flex items-center justify-between px-8 py-4 bg-white dark:bg-gray-800 border-b dark:border-gray-700 shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-black text-blue-600 dark:text-blue-400">TrelloJiraCore</h1>
            <nav class="flex gap-4 mr-8">
                <a href="#" id="nav-boards" class="font-bold text-gray-600 dark:text-gray-300 hover:text-blue-500">بوردها</a>
            </nav>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative">
                <input type="text" id="global-search" placeholder="جستجو..." class="pr-10 pl-4 py-2 rounded-full border dark:border-gray-600 bg-gray-50 dark:bg-gray-700 focus:ring-2 focus:ring-blue-500 outline-none w-64">
                <span class="absolute right-3 top-2.5 text-gray-400">🔍</span>
            </div>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                <span id="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <!-- Boards List View -->
    <main id="boards-view" class="p-8 hidden">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold">بوردهای من</h2>
            <button id="btn-new-board" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-bold transition-transform active:scale-95">بورد جدید +</button>
        </div>
        <div id="boards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Boards go here -->
        </div>
    </main>

    <!-- Kanban Board View -->
    <main id="kanban-view" class="flex hidden">
        <div class="flex-grow overflow-hidden flex flex-col">
            <div id="board-header" class="p-6 border-b dark:border-gray-700 bg-white dark:bg-gray-800 flex justify-between items-center">
                <div>
                    <h2 id="board-title" class="text-2xl font-bold">نام بورد</h2>
                    <p id="board-description" class="text-gray-500 dark:text-gray-400"></p>
                </div>
                <div class="flex gap-2">
                    <button class="bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded font-bold hover:bg-gray-300">اعضا</button>
                    <button class="bg-gray-200 dark:bg-gray-700 px-4 py-2 rounded font-bold hover:bg-gray-300">فیلتر</button>
                </div>
            </div>
            <div id="kanban-board" class="kanban-board flex-grow">
                <!-- Columns go here -->
            </div>
        </div>
        <aside class="sidebar hidden md:block">
            <h3 class="font-bold text-lg mb-4 border-b pb-2">تاریخچه فعالیت‌ها</h3>
            <div id="activity-log-container">
                <!-- Logs go here -->
            </div>
        </aside>
    </main>

    <!-- Card Detail Modal -->
    <div id="card-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">جزئیات کارت</h3>
                <button id="close-modal" class="text-gray-500 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <form id="card-form">
                <input type="hidden" id="modal-card-id">
                <label class="block font-bold mb-1">عنوان کارت</label>
                <input type="text" id="modal-card-title" required>

                <label class="block font-bold mb-1">توضیحات</label>
                <textarea id="modal-card-desc" rows="4"></textarea>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold mb-1">اولویت</label>
                        <select id="modal-card-priority">
                            <option value="0">کم</option>
                            <option value="1">متوسط</option>
                            <option value="2">بالا</option>
                            <option value="3">فوری</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">مسئول</label>
                        <input type="text" id="modal-card-assignee">
                    </div>
                </div>

                <label class="block font-bold mb-1">تاریخ سررسید</label>
                <input type="date" id="modal-card-due">

                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" id="btn-cancel-card" class="bg-gray-300 text-gray-800 px-4 py-2 rounded">انصراف</button>
                    <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">ذخیره تغییرات</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification-area" class="fixed bottom-6 left-6 flex flex-col gap-2 z-[1000]"></div>

    <script src="lib/signalr.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
