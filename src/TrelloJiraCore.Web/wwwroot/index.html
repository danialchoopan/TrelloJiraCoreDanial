<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrelloJiraCore - مدیریت پروژه هوشمند و تیمی</title>
    <link rel="stylesheet" href="lib/tailwind.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">
    <header class="flex items-center justify-between px-10 py-3 bg-white dark:bg-slate-900 border-b dark:border-slate-800 shadow-sm sticky top-0 z-50">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <svg class="w-8 h-8 text-blue-600" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14H7v-7h3v7zm5 0h-3V7h3v10zm5 0h-3v-4h3v4z"/></svg>
                <h1 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight">TrelloJiraCore</h1>
            </div>
            <nav class="flex gap-6 mr-10">
                <a href="#" id="nav-boards" class="font-bold text-slate-600 dark:text-slate-300 hover:text-blue-600 flex items-center gap-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    بوردها
                </a>
                <a href="#" class="font-bold text-slate-400 dark:text-slate-500 cursor-not-allowed flex items-center gap-2">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    تیم‌ها
                </a>
            </nav>
        </div>
        <div class="flex items-center gap-5">
            <div class="relative">
                <input type="text" id="global-search" placeholder="جستجوی همه‌جانبه..." class="pr-12 pl-4 py-2.5 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none w-80 text-sm transition-all">
                <svg class="absolute right-4 top-3 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </div>
            <button id="theme-toggle" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-blue-100 dark:hover:bg-blue-900/30 transition-colors">
                <svg id="sun-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="moon-icon" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </header>

    <main id="boards-view" class="p-12 hidden">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-black text-slate-800 dark:text-white">فضای کاری شما</h2>
            <button id="btn-new-board" class="btn-primary">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                بورد جدید
            </button>
        </div>
        <div id="boards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Boards -->
        </div>
    </main>

    <main id="kanban-view" class="flex hidden">
        <div class="flex-grow overflow-hidden flex flex-col">
            <div id="board-header" class="px-8 py-5 border-b dark:border-slate-800 bg-white dark:bg-slate-900 flex justify-between items-center">
                <div class="flex items-center gap-6">
                    <div>
                        <h2 id="board-title" class="text-2xl font-black text-slate-800 dark:text-white">...</h2>
                        <p id="board-description" class="text-slate-500 dark:text-slate-400 text-sm mt-1"></p>
                    </div>
                    <div class="h-10 w-px bg-slate-200 dark:bg-slate-700"></div>
                    <div id="board-members-list" class="flex -space-x-2 rtl:space-x-reverse">
                        <!-- Member Avatars -->
                    </div>
                </div>
                <div class="flex gap-3">
                    <button class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-bold hover:bg-slate-200 flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20v-8m0 0V4m0 8h8m-8 0H4"></path></svg>
                        دعوت
                    </button>
                    <button class="px-4 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 font-bold hover:bg-slate-200 flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                        فیلترها
                    </button>
                </div>
            </div>
            <div id="kanban-board" class="kanban-board">
                <!-- Columns -->
            </div>
        </div>
        <aside class="sidebar hidden xl:block">
            <div class="flex items-center gap-2 mb-6 border-b dark:border-slate-800 pb-4">
                <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <h3 class="font-black text-lg">فعالیت‌های اخیر</h3>
            </div>
            <div id="activity-log-container" class="space-y-4">
                <!-- Logs -->
            </div>
        </aside>
    </main>

    <div id="card-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-2xl font-black flex items-center gap-3">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    ویرایش تسک
                </h3>
                <button id="close-modal" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 transition-colors">&times;</button>
            </div>
            <form id="card-form" class="space-y-5">
                <input type="hidden" id="modal-card-id">
                <div>
                    <label class="block font-bold text-sm text-slate-500 mb-2">عنوان تسک</label>
                    <input type="text" id="modal-card-title" required class="w-full px-4 py-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-sm text-slate-500 mb-2">توضیحات تکمیلی</label>
                    <textarea id="modal-card-desc" rows="4" class="w-full px-4 py-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block font-bold text-sm text-slate-500 mb-2">اولویت انجام</label>
                        <select id="modal-card-priority" class="w-full px-4 py-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="0">کم</option>
                            <option value="1">متوسط</option>
                            <option value="2">بالا</option>
                            <option value="3">فوری</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-sm text-slate-500 mb-2">مسئول تسک</label>
                        <input type="text" id="modal-card-assignee" class="w-full px-4 py-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-sm text-slate-500 mb-2">تاریخ ددلاین</label>
                    <input type="date" id="modal-card-due" class="w-full px-4 py-3 rounded-xl border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 mt-10 pt-6 border-t dark:border-slate-800">
                    <button type="button" id="btn-cancel-card" class="px-6 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold hover:bg-slate-200 transition-colors">انصراف</button>
                    <button type="submit" class="btn-primary px-10">ذخیره تغییرات</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification-area" class="fixed bottom-8 left-8 flex flex-col gap-3 z-[1000]"></div>

    <script src="lib/signalr.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
